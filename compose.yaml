services:
  backend:
    image: deltronfr/solstice:backend-${SOLSTICE_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SOLSTICE_HTTP_ADDR: :8080
      SOLSTICE_DATABASE_DSN: file:/data/solstice.db
      SOLSTICE_UPLOAD_DIR: /data/uploads
    volumes:
      - solstice_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: deltronfr/solstice:frontend-${SOLSTICE_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SOLSTICE_DOMAIN: ${SOLSTICE_DOMAIN:?Set SOLSTICE_DOMAIN in .env}
      SOLSTICE_SOLANA_RPC_URL: ${SOLSTICE_SOLANA_RPC_URL:-https://api.devnet.solana.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  solstice_data:
  caddy_data:
  caddy_config:
