[package]
name = "pact-escrow"
version = "0.1.0"
description = "Pact marketplace escrow program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pact_escrow"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.2", features = ["associated_token", "token"] }
